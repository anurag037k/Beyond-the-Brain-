<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Confirmed | Beyond The Brain</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4 md:p-8 flex items-center justify-center min-h-screen">

    <div class="max-w-md w-full bg-white rounded border border-gray-300 p-6 text-center shadow-sm">
        
        <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-3 font-bold text-xl">
            ✓
        </div>

        <h1 class="text-xl font-bold text-gray-800">Registration Submitted</h1>
        <p class="text-xs text-gray-500 mt-1">Thank you for registering for <strong>BEYOND THE BRAIN</strong>.</p>

        <div class="bg-gray-50 border border-gray-200 rounded p-4 mt-6 text-left text-xs space-y-2">
            <p><strong>Registration ID:</strong> <span id="confId" class="font-mono text-blue-600">---</span></p>
            <p><strong>Name:</strong> <span id="confName">---</span></p>
            <p><strong>UTR Ref:</strong> <span id="confUtr" class="font-mono">---</span></p>
            <p><strong>Amount Paid:</strong> ₹119</p>
        </div>

        <p class="text-xs text-gray-500 mt-4">We will verify your transaction ID and send the webinar link to your email prior to the event.</p>

        <a href="index.html" class="inline-block mt-6 text-xs text-blue-600 hover:underline">
            ← Return to Registration Page
        </a>
    </div>

    <script>
        const record = JSON.parse(sessionStorage.getItem('last_registration'));
        if (record) {
            document.getElementById('confId').innerText = record.id;
            document.getElementById('confName').innerText = record.name;
            document.getElementById('confUtr').innerText = record.utr;
        }
    </script>

</body>
</html>
